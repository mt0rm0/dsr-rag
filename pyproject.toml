[project]
name = "dsr-rag"
version = "0.1.0"
description = "Hands-on RAG workshop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb==0.5.3",
    "cryptography>=48.0.0",
    "einops==0.8.0",
    "gradio>=5.0.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy==1.26.4",
    "posthog>=2.4.0,<6.0.0",
    "pypdf==7.0.1",
    "python-docx==1.1.2",
    "requests==2.32.3",
    "sentence-transformers==3.0.1",
    "tqdm==4.66.4",
    "umap-learn>=0.5.12",
    "yake==0.4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
bonus = [
    "langchain>=0.3.30",
    "langchain-chroma>=0.2.2",
    "langchain-community>=0.3.21",
    "llama-index>=0.14.22",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-llms-ollama>=0.10.1",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsst"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Notebooks silence warnings before importing the libraries that emit them.
"*.ipynb" = ["E402"]
# Telemetry and warning filters have to be set before chromadb is imported.
"src/ragsst/ragtool.py" = ["E402"]
