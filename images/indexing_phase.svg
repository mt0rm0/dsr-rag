<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Indexing phase diagram</title>
  <desc>Left-to-right flow: documents (TXT, PDF, DOCX) to Chunker to Embedder to Vector DB</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="22" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">Indexing phase, done once or when documents change</text>

  <text x="52" y="50" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">Documents</text>
  <rect x="16" y="58" width="72" height="32" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="52" y="74" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">TXT</text>
  <rect x="16" y="98" width="72" height="32" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="52" y="114" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">PDF</text>
  <rect x="16" y="138" width="72" height="32" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="52" y="154" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">DOCX</text>

  <line x1="88" y1="74"  x2="162" y2="106" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="88" y1="114" x2="162" y2="114" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="88" y1="154" x2="162" y2="122" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="162" y="88" width="130" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="227" y="108" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Chunker</text>
  <text x="227" y="126" font-family="sans-serif" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">splits text into pieces</text>

  <line x1="292" y1="114" x2="348" y2="114" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="348" y="88" width="148" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="422" y="108" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Embedder</text>
  <text x="422" y="126" font-family="sans-serif" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">text → vectors</text>

  <line x1="496" y1="114" x2="546" y2="114" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="546" y="80" width="118" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="605" y="104" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Vector DB</text>
  <text x="605" y="122" font-family="sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">stores + indexes</text>
  <text x="605" y="138" font-family="sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">ChromaDB</text>

  <text x="605" y="170" font-family="sans-serif" font-size="11" fill="#888780" text-anchor="middle">✓ ready for queries</text>
</svg>
