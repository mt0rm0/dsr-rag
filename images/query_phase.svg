<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Query phase diagram</title>
  <desc>User question flows to Embedder and Prompt builder; Vector DB returns top-k chunks; LLM returns answer to User</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="22" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">Query phase, runs on every user question</text>

  <ellipse cx="332" cy="58" rx="56" ry="26" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="332" y="58" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">User</text>

  <line x1="332" y1="84" x2="332" y2="222" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="344" y="156" font-family="sans-serif" font-size="11" fill="#5F5E5A">question</text>

  <path d="M276 58 L110 58 L110 128" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="190" y="50" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">question</text>

  <rect x="42" y="128" width="136" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="110" y="148" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Embedder</text>
  <text x="110" y="166" font-family="sans-serif" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">text to query vector</text>

  <line x1="110" y1="180" x2="110" y2="222" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="42" y="222" width="136" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="110" y="246" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Vector DB</text>
  <text x="110" y="264" font-family="sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">nearest-neighbour</text>
  <text x="110" y="280" font-family="sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">search (HNSW)</text>

  <line x1="178" y1="256" x2="258" y2="256" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="218" y="248" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">top-k chunks</text>

  <rect x="258" y="222" width="148" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="332" y="246" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Prompt builder</text>
  <text x="332" y="264" font-family="sans-serif" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">question + context</text>

  <line x1="406" y1="256" x2="474" y2="256" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="440" y="248" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">prompt</text>

  <rect x="474" y="222" width="120" height="68" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="534" y="246" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">LLM</text>
  <text x="534" y="264" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Ollama / llama3.2</text>

  <path d="M534 222 L534 58 L388 58" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="560" y="140" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start">answer</text>
</svg>
